name: feature_folder_cli_plus
description: >-
  A powerful CLI tool that generates clean folder structures following the 
  feature-first architecture pattern. Supports BLoC, Cubit, Provider & GetX.
version: 2.0.1
homepage: https://github.com/bazl-E/feature_folder_structure
repository: https://github.com/bazl-E/feature_folder_structure
issue_tracker: https://github.com/bazl-E/feature_folder_structure/issues
documentation: https://github.com/bazl-E/feature_folder_structure#readme

topics:
  - cli
  - flutter
  - bloc
  - architecture
  - code-generator

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  ansicolor: ^2.0.3
  args: ^2.7.0
  path: ^1.9.1

dev_dependencies:
  test: ^1.29.0

executables:
  ff: main
